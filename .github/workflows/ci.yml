name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: GDExtension check
        run: cargo check -p derelict_godot --all-targets

  test:
    # Two-OS matrix: golden hashes must be bit-identical across platforms,
    # catching any float/HashMap determinism slip immediately.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Determinism guard (no ambient RNG in core)
        shell: bash
        run: |
          ! grep -rnE --include='*.rs' '\b(thread_rng|from_entropy)\s*\(' crates/derelict_core/src
      - name: Tests
        run: cargo test --workspace
      - name: Export golden (Synaptic Sea contract)
        run: cargo test -p derelict_godot --test export_golden
      - name: Structural stress sweep (fail-closed)
        run: cargo run -p derelict_cli --release -- --stress
      - name: CLI smoke
        run: cargo run -p derelict_cli -- --sweep 5 --archetype frigate
      - name: Author golden validate
        run: cargo run -p derelict_cli -- --author-validate crates/derelict_core/assets/golden_areas/airlock_2x2.json

  builder:
    name: Builder headless checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout world generator
        uses: actions/checkout@v4
        with:
          path: world_gen
      - name: Checkout Synaptic Sea content
        uses: actions/checkout@v4
        with:
          repository: 9thLevelSoftware/the-synaptic-sea
          path: the-synaptic-sea
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: world_gen
      - name: Build and run builder checks
        working-directory: world_gen
        shell: pwsh
        run: ./scripts/test_builder.ps1 -SynapticSeaRoot ../the-synaptic-sea
